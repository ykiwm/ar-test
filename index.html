<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Test</title>

    <!-- A-Frame: 3Dを描くライブラリ -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- AR.js: カメラでマーカーを認識するライブラリ（バージョン固定で安定版を使う） -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <!--
      a-scene: AR の舞台全体
      embedded: 画面全体に広げる
      arjs: AR.js を有効にする
        sourceType: webcam → カメラ映像を使う
        facingMode: environment → 背面カメラ（アウトカメラ）を使う
        debugUIEnabled: false → デバッグ用UIを非表示
      vr-mode-ui: VRボタンを非表示（スマホでは不要）
    -->
    <a-scene
      embedded
      arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
    >

      <!--
        a-marker: 「Hiroマーカーが見えたら...」という条件
        preset="hiro": 標準マーカー「Hiro」を使う
      -->
      <a-marker preset="hiro">

        <!-- マーカーの上に黄色いボックスを表示する -->
        <!-- position="0 0.5 0": 高さ0.5の位置（マーカーの真上）に置く -->
        <a-box
          position="0 0.5 0"
          color="yellow"
          scale="1 1 1"
        ></a-box>

      </a-marker>

      <!-- カメラ -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
