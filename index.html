<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Test</title>

    <script>
      // getUserMedia shim for multi-back-camera Android phones where
      // facingMode:'environment' returns NotReadableError. Falls back to
      // probing each back camera by deviceId, then to {video:true}.
      // Also swaps a front-camera result for a back-camera if possible.
      // Must run BEFORE AR.js loads so AR.js's internal call also benefits.
      (function () {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
        var orig = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
        var origEnum = navigator.mediaDevices.enumerateDevices.bind(navigator.mediaDevices);
        window.__gumShim = { used: null, opened: null, swapped: null };

        function isBackLabel(label) {
          return /back|rear|environment/i.test(label || '');
        }
        function isFrontLabel(label) {
          return /front|user|self/i.test(label || '');
        }

        async function trySwapToBack(stream) {
          var tracks = stream.getVideoTracks();
          if (!tracks.length) return stream;
          var track = tracks[0];
          var label = track.label || '';
          var settings = track.getSettings ? track.getSettings() : {};
          if (isBackLabel(label) || settings.facingMode === 'environment') return stream;
          if (!isFrontLabel(label) && settings.facingMode !== 'user') return stream;
          try {
            var devs = await origEnum();
            var backCams = devs.filter(function (d) {
              return d.kind === 'videoinput' && isBackLabel(d.label);
            });
            for (var i = 0; i < backCams.length; i++) {
              try {
                var newS = await orig({
                  audio: false,
                  video: { deviceId: { exact: backCams[i].deviceId } },
                });
                stream.getTracks().forEach(function (t) { t.stop(); });
                window.__gumShim.swapped = backCams[i].label;
                console.warn('[gUM-shim] swapped front->back: ' + backCams[i].label);
                return newS;
              } catch (e) {
                console.warn('[gUM-shim] back-swap ' + backCams[i].label + ': ' + e.name);
              }
            }
          } catch (e) {
            console.warn('[gUM-shim] enum-for-swap failed: ' + e.name);
          }
          return stream;
        }

        navigator.mediaDevices.getUserMedia = function (constraints) {
          var wantedEnv = !!(
            constraints && constraints.video &&
            (constraints.video.facingMode === 'environment' ||
             (constraints.video.facingMode && constraints.video.facingMode.ideal === 'environment') ||
             (constraints.video.facingMode && constraints.video.facingMode.exact === 'environment'))
          );
          return orig(constraints).then(function (stream) {
            window.__gumShim.opened = (stream.getVideoTracks()[0] || {}).label || '(unknown)';
            return wantedEnv ? trySwapToBack(stream) : stream;
          }).catch(async function (err) {
            var relaxable = ['NotReadableError', 'NotFoundError', 'OverconstrainedError'];
            if (relaxable.indexOf(err.name) === -1) throw err;
            window.__gumShim.used = err.name;
            console.warn('[gUM-shim] ' + err.name + ' on strict constraints');

            try {
              var devs = await origEnum();
              var cams = devs.filter(function (d) { return d.kind === 'videoinput'; });
              var backCams = cams.filter(function (c) { return isBackLabel(c.label); });
              var candidates = backCams.length ? backCams : cams.filter(function (c) {
                return !isFrontLabel(c.label);
              });
              if (!candidates.length) candidates = cams;
              for (var i = 0; i < candidates.length; i++) {
                try {
                  var stream = await orig({
                    audio: false,
                    video: { deviceId: { exact: candidates[i].deviceId } },
                  });
                  window.__gumShim.used = err.name + ' -> deviceId';
                  window.__gumShim.opened = candidates[i].label;
                  console.warn('[gUM-shim] opened by deviceId: ' + candidates[i].label);
                  return stream;
                } catch (e) {
                  console.warn('[gUM-shim] tried ' + candidates[i].label + ': ' + e.name);
                }
              }
            } catch (e) {
              console.warn('[gUM-shim] enumerate failed: ' + e.name);
            }

            window.__gumShim.used = err.name + ' -> video:true';
            var s = await orig({ audio: false, video: true });
            window.__gumShim.opened = (s.getVideoTracks()[0] || {}).label || '(unknown)';
            return await trySwapToBack(s);
          });
        };
      })();
    </script>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #debug-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.75);
        color: #0f0;
        padding: 8px 12px;
        font-family: monospace;
        font-size: 12px;
        z-index: 9999;
        max-height: 50vh;
        overflow-y: auto;
        white-space: pre-wrap;
        line-height: 1.4;
        pointer-events: none;
      }
      #debug-overlay.has-error {
        color: #f66;
        pointer-events: auto;
      }
      #debug-toggle {
        position: fixed;
        top: 4px;
        right: 4px;
        z-index: 10000;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        border: 1px solid #888;
        padding: 4px 8px;
        font-size: 11px;
        font-family: monospace;
      }
    </style>
  </head>

  <body>
    <button id="debug-toggle">debug</button>
    <div id="debug-overlay">initializing...</div>

    <script>
      const dbg = document.getElementById('debug-overlay');
      const toggle = document.getElementById('debug-toggle');
      const lines = [];

      function log(msg, isError) {
        const t = new Date().toLocaleTimeString();
        lines.push('[' + t + '] ' + msg);
        dbg.textContent = lines.join('\n');
        if (isError) dbg.classList.add('has-error');
        console.log('[AR]', msg);
      }

      toggle.addEventListener('click', () => {
        dbg.style.display = dbg.style.display === 'none' ? '' : 'none';
      });

      log('UA: ' + navigator.userAgent);
      log('secure context: ' + window.isSecureContext);
      log('protocol: ' + location.protocol);
      log('mediaDevices: ' + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));

      // Pre-flight: try opening environment camera (shim will auto-relax on failure)
      (async () => {
        try {
          if (!navigator.mediaDevices) {
            log('ERROR: navigator.mediaDevices is undefined', true);
            return;
          }
          const before = await navigator.mediaDevices.enumerateDevices();
          const camsBefore = before.filter((d) => d.kind === 'videoinput');
          log('video inputs (pre-permission): ' + camsBefore.length);

          try {
            const s = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'environment' },
              audio: false,
            });
            const track = s.getVideoTracks()[0];
            const settings = track ? track.getSettings() : {};
            const shim = window.__gumShim || {};
            log('OK: gUM opened');
            log('  shim used: ' + (shim.used || 'no'));
            log('  shim opened: ' + (shim.opened || '(n/a)'));
            log('  shim swapped: ' + (shim.swapped || 'no'));
            log('  track label: ' + (track && track.label ? track.label : '(none)'));
            log('  settings: ' + JSON.stringify(settings));
            s.getTracks().forEach((t) => t.stop());
          } catch (e) {
            log('gUM ERROR: ' + e.name + ': ' + e.message, true);
          }

          // Re-enumerate after permission to see real labels
          const after = await navigator.mediaDevices.enumerateDevices();
          const camsAfter = after.filter((d) => d.kind === 'videoinput');
          log('video inputs (post-permission): ' + camsAfter.length);
          camsAfter.forEach((c, i) => {
            log('  [' + i + '] "' + (c.label || '(still empty)') + '"');
          });
        } catch (e) {
          log('enumerateDevices ERROR: ' + e.name + ': ' + e.message, true);
        }
      })();

      window.addEventListener('error', (e) => {
        log('window.error: ' + (e.message || e.error), true);
      });
      window.addEventListener('unhandledrejection', (e) => {
        log('promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), true);
      });
      window.addEventListener('arjs-video-loaded', () => log('AR.js: arjs-video-loaded'));
      window.addEventListener('camera-init', () => log('AR.js: camera-init'));
      window.addEventListener('camera-error', (e) => {
        log('AR.js: camera-error ' + JSON.stringify(e.detail || {}), true);
      });
    </script>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; antialias: true;"
    >
      <a-marker preset="hiro">
        <a-box position="0 0.5 0" color="yellow"></a-box>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
